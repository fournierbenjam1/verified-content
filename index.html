<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Verified Content</title>
<style>
body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,sans-serif}main{max-width:700px;margin:auto;padding:20px 16px}
.card{background:white;padding:18px;border-radius:18px;margin:16px 0;box-shadow:0 3px 15px #0001}
h1{margin:0 0 6px}p{color:#6b7280}input{width:100%;padding:14px;border:1px solid #ccc;border-radius:12px;font-size:16px;box-sizing:border-box}button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;background:#111827;color:white;font-weight:700;font-size:16px}.small{font-size:13px;color:#6b7280}.badge{display:inline-block;padding:8px 12px;border-radius:99px;font-weight:700;background:#fef3c7}.row{padding:10px 0;border-bottom:1px solid #eee}.label{font-size:13px;color:#6b7280}.value{font-weight:650;overflow-wrap:anywhere}
</style></head><body><main>
<h1>🔎 Verified Content</h1><p>Votre conseiller en provenance et en vérification.</p>
<div class="card">
<input id="url" type="url" placeholder="https://exemple.com/image.jpg ou article">
<button id="go">Analyser cette URL</button>
<p class="small">Collez n’importe quelle URL publique. Les boutons de démonstration ont été supprimés : ils ne sont plus nécessaires.</p>
</div>
<div id="result" class="card" hidden></div>
<script>
const $=id=>document.getElementById(id);
function show(r){$('result').hidden=false;$('result').innerHTML='<div class="badge">'+r.badge+'</div>'+
Object.entries(r.rows||{}).map(([k,v])=>'<div class="row"><div class="label">'+k+'</div><div class="value">'+v+'</div></div>').join('')+
'<p class="small">'+(r.note||'')+'</p>'}
$('go').onclick=async()=>{
 const u=$('url').value.trim(); if(!u){show({badge:'⚪ URL manquante',rows:{},note:'Collez une URL publique puis relancez l’analyse.'});return}
 show({badge:'⏳ Analyse en cours…',rows:{},note:'Récupération du contenu…'});
 try{const res=await fetch('/api/analyze?url='+encodeURIComponent(u));const data=await res.json();if(!res.ok)throw Error(data.error||'Erreur serveur');show(data)}
 catch(e){show({badge:'⚪ Analyse impossible',rows:{Erreur:e.message},note:'Vérifiez que LANCER.bat est toujours ouvert et que l’URL est publique. Certains sites bloquent les robots ou exigent une connexion.'})}
};
</script></main></body></html>
